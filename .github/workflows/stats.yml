name: Generate GitHub Readme Stats

on:
  schedule:
    - cron: '0 0 * * *' # Si aggiorna ogni notte a mezzanotte
  workflow_dispatch: # Ti permette di avviarlo manualmente dalle Actions

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: anuraghazra/github-readme-stats-action@v2
        with:
          card: stats
          options: theme=radial&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: anuraghazra/github-readme-stats-action@v2
        with:
          card: top-langs
          options: theme=radial&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update stats"
          git push

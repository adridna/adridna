name: Generate GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Concede i permessi di scrittura direttamente al job
    steps:
      - uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Download GitHub Stats Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=adridna&show_icons=true&theme=radial" -o profile/stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=adridna&layout=compact&theme=radial" -o profile/top-langs.svg

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update generated stats cards"
          git push
